<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVELA responsive verification</title>
<style>body{margin:0;padding:20px;background:#f7f8f4;color:#173f3a;font:16px system-ui}header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px}label{display:flex;gap:6px;align-items:center}select,button{font:inherit;padding:8px;border:1px solid #cbd8d0;border-radius:8px;background:white}iframe{display:block;border:1px solid #cbd8d0;border-radius:12px;background:white;max-width:none}main{overflow:auto}p{font-size:14px;color:#596963}</style>
<header><strong>Responsive verification</strong><label>Viewport width<select id="width"><option>375</option><option>768</option><option>1440</option></select></label><label>Screen<select id="screen"><option value="/">Landing</option><option value="/patient/chat">Patient chat</option><option value="/patient/home">Patient home</option><option value="/patient/careplan">Care plan</option><option value="/patient/records">Records</option><option value="/patient/timeline">Timeline</option><option value="/clinician">Clinician inbox</option></select></label><button id="reload">Reload frame</button></header>
<p>A fixed CSS viewport for layout testing; this does not emulate a physical phone, touch input, or a mobile operating system.</p>
<main><iframe title="AVELA responsive preview" id="preview" width="375" height="900" src="/"></iframe></main>
<script>const frame=document.getElementById('preview');document.getElementById('width').addEventListener('change',event=>frame.width=event.target.value);document.getElementById('screen').addEventListener('change',event=>frame.src=event.target.value);document.getElementById('reload').addEventListener('click',()=>frame.src=document.getElementById('screen').value);</script>
</html>
